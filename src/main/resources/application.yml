spring:
  application:
    name: ledger-settlement
  datasource:
    url: jdbc:postgresql://localhost:5432/ledger
    username: ledger
    password: ledger
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  sql:
    init:
      mode: always
  threads:
    virtual:
      enabled: true

server:
  port: 8080

ledger:
  fee-rate: 0.031